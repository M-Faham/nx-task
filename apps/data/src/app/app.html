<div class="flex items-center justify-between mb-10">
  <h1 class="text-2xl font-bold text-gray-900">App Two - Information</h1>
</div>

<div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
  <lib-company-card [company]="companyData()" />

  <div class="flex flex-col gap-6">
    <div class="rounded-xl border border-blue-200 bg-blue-100 p-6">
      <h3 class="text-lg font-semibold text-blue-800">About Us</h3>
      <p class="mt-2 text-sm text-gray-600">{{ companyData().aboutUs }}</p>
    </div>
    <div class="rounded-xl border border-green-200 bg-green-100 p-6">
      <h3 class="text-lg font-semibold text-green-800">Our Mission</h3>
      <p class="mt-2 text-sm text-gray-600">{{ companyData().mission }}</p>
    </div>
  </div>
</div>
