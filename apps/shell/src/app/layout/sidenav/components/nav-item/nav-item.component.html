<a
  [routerLink]="item().path"
  routerLinkActive="bg-blue-200 font-semibold"
  [routerLinkActiveOptions]="{ exact: item().exact }"
  class="flex items-center gap-3 rounded p-3 text-sm text-gray-600 hover:bg-gray-50"
>
  <span
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded"
    [class]="item().iconBg"
  >
    <img [src]="item().imgUrl" class="h-4 w-4" alt="" />
  </span>
  <span>{{ item().label }} {{ item().subtitle }}</span>
</a>
